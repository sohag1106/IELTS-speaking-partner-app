# Render Blueprint: one free web service serves the API, Socket.IO and the
# built client from a single HTTPS URL. DATABASE_URL is entered in the
# dashboard on first deploy (sync: false).
services:
  - type: web
    name: ielts-speaking-partner
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start -w server
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
